[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2real-train"
version = "0.1.0"
description = "Simulation to Reality Demonstration"
readme = "README.md"
requires-python = ">=3.12.3"
license = {text = "LICENSE"}
authors = []
dependencies = [
    "absl-py",
    "brax",
    "etils",
    "flax",
    "framesviewer==1.0.2",
    "jax[cuda12]",
    "lxml",
    "mediapy",
    "ml_collections",
    "mujoco-mjx",
    "mujoco>=3.5.1.dev879036130",
    "onnxruntime",
    "warp-lang>=1.11",
    "orbax-checkpoint>=0.11.22",
    "tqdm",
    "torch",
    "pytest",
]

[project.optional-dependencies]
dev = ["pytest"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true
python-preference = "managed"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
